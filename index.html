    <script>
      (function() {
        if (typeof window !== 'undefined') {
          // AI Studio environment disables HMR WebSockets.
          // Handle 'vite-hmr' WebSocket gracefully to prevent "WebSocket closed without opened" errors.
          if (window.WebSocket) {
            var NativeWebSocket = window.WebSocket;
            function MockHmrWebSocket(url, protocols) {
              var isHmr =
                protocols === 'vite-hmr' ||
                (typeof protocols === 'string' && protocols.indexOf('vite-hmr') !== -1) ||
                (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1);
              if (isHmr) {
                var target = new EventTarget();
                target.readyState = 1;
                target.binaryType = 'blob';
                target.send = function() {};
                target.close = function() {
                  target.readyState = 3;
                  target.dispatchEvent(new Event('close'));
                };
                setTimeout(function() {
                  target.dispatchEvent(new Event('open'));
                }, 0);
                return target;
              }
              return new NativeWebSocket(url, protocols);
            }
            MockHmrWebSocket.prototype = NativeWebSocket.prototype;
            MockHmrWebSocket.CONNECTING = NativeWebSocket.CONNECTING;
            MockHmrWebSocket.OPEN = NativeWebSocket.OPEN;
            MockHmrWebSocket.CLOSING = NativeWebSocket.CLOSING;
            MockHmrWebSocket.CLOSED = NativeWebSocket.CLOSED;
            window.WebSocket = MockHmrWebSocket;
          }

          // Suppress unhandled WebSocket rejections from @vite/client in dev iframe
          window.addEventListener('unhandledrejection', function(event) {
            var reason = event && event.reason;
            var msg = (reason && (reason.message || reason.stack || String(reason))) || '';
            if (
              msg.indexOf('WebSocket') !== -1 ||
              msg.indexOf('vite-hmr') !== -1 ||
              msg.indexOf('@vite/client') !== -1 ||
              (reason && reason.stack && reason.stack.indexOf('@vite/client') !== -1)
            ) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          }, true);

          window.addEventListener('error', function(event) {
            var msg = (event && (event.message || event.filename || '')) || '';
            if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('@vite/client') !== -1) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          }, true);
        }
      })();
    </script>
